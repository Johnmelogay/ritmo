app = 'ritmo-coach-john'
primary_region = 'gru'

[build]
  dockerfile = 'whatsapp/Dockerfile'

[env]
  NODE_ENV = 'production'
  VITE_FIREBASE_PROJECT_ID = 'ai-gym-and-diet-manager'
  RITMO_USER_UID = 'Qz4Hmsmav2hXCBZgX1dA1STMfU82'
  PORT = '8080'

[mounts]
  source = 'ritmo_auth_data'
  destination = '/app/whatsapp/auth_info'
  initial_size = '1gb'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
