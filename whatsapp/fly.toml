app = 'ritmo-whatsapp-coach'
primary_region = 'gru'

[build]
  dockerfile = 'Dockerfile'

[env]
  NODE_ENV = 'production'
  VITE_FIREBASE_PROJECT_ID = 'ai-gym-and-diet-manager'

[mounts]
  source = 'ritmo_auth_data'
  destination = '/app/whatsapp/auth_info'
  initial_size = '1gb'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
